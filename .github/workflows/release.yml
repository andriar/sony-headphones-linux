name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PRODUCT: sony-headphones
  APP_ID: com.andriar.SonyHeadphones
  NFPM_VERSION: "2.48.0"
  NFPM_SHA256: "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750"

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match sonyeq.__version__
        run: |
          v=$(python3 -c 'import sonyeq; print(sonyeq.__version__)')
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: python3 -m unittest discover -s tests -t .
      - name: Install nfpm
        run: |
          f="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$f"
          echo "$NFPM_SHA256  $f" | sha256sum -c -
          tar xzf "$f" nfpm && sudo install -m 755 nfpm /usr/local/bin/nfpm
      - run: scripts/build-packages.sh
      - uses: actions/upload-artifact@v4
        with: { name: packages, path: dist/ }

  # Built on every release as a check, but not published yet. RFCOMM inside the sandbox works since
  # the manifest added --share=network; add this job to publish.needs and the upload loop to ship it.
  flatpak:
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Build bundle
        run: |
          v=$(python3 -c 'import sonyeq; print(sonyeq.__version__)')
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=build/repo build/app \
            packaging/flatpak/$APP_ID.yml
          mkdir -p dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            build/repo "dist/sony-headphones-linux-$v.flatpak" "$APP_ID"
      - uses: actions/upload-artifact@v4
        with: { name: flatpak-preview, path: dist/ }

  publish:
    needs: [packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: packages, path: dist }
      # Packages are served by the apps-site Pages project; pushing there triggers its deploy workflow.
      - uses: actions/checkout@v4
        with:
          repository: andriar/apps-site
          token: ${{ secrets.APPS_SITE_TOKEN }}
          path: apps-site
      - name: Copy packages and write releases.json
        run: scripts/publish-site.sh apps-site "$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
      - name: Push to apps-site
        working-directory: apps-site
        run: |
          git config user.name "release bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/sony-headphones
          git commit -m "release: sony-headphones $GITHUB_REF_NAME"
          git push
      - name: GitHub release (private backup)
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm --title "$GITHUB_REF_NAME" --notes-from-tag
        env: { GH_TOKEN: "${{ github.token }}" }
